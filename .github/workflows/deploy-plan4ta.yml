# Deploy wspolnego kodu na hosting klasy 4Ta (projekt plan4ta -> site plan4ta -> plan4ta.web.app)
# + wdrozenie regul Realtime Database z repo (database.rules.json)
name: Deploy plan4ta

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Najmniejszy mozliwy zakres uprawnien (repo tylko do odczytu)
permissions:
  contents: read

# Kolejne wdrozenia nie nakladaja sie na siebie
concurrency:
  group: deploy-plan4ta
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      # Sekret w zmiennej srodowiskowej - kontekst "secrets" nie jest dostepny
      # w wyrazeniach "if", a "env" jest. Pozwala pominac krok wdrozenia regul,
      # gdy sekret nie istnieje (np. swiezy klon/fork).
      FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAN4TA }}
    steps:
      # Akcje przypiete do commita (a nie do mutowalnego tagu)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Kontrola skladni i testy
        run: |
          npm run check
          npm test

      # Kolejnosc ma znaczenie: najpierw publikujemy aplikacje, a dopiero potem
      # reguly bazy. Ewentualny blad wdrozenia regul (np. brak uprawnien IAM
      # konta serwisowego) nie blokuje wtedy publikacji nowej wersji serwisu.
      - name: Publikacja hostingu
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAN4TA }}
          channelId: live
          projectId: plan4ta
          target: plan4ta

      - name: Wdrozenie regul Realtime Database
        if: env.FIREBASE_SA != ''
        run: |
          npm install -g firebase-tools
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only database --project plan4ta --non-interactive
