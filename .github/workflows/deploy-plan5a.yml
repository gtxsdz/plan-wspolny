# Deploy wspolnego kodu na hosting klasy 5a (projekt plan-e5ce7 -> site plan5a -> plan5a.web.app)
# + wdrozenie regul Realtime Database z repo (database.rules.json)
name: Deploy plan5a

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Najmniejszy mozliwy zakres uprawnien (repo tylko do odczytu)
permissions:
  contents: read

# Kolejne wdrozenia nie nakladaja sie na siebie
concurrency:
  group: deploy-plan5a
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      # Akcje przypiete do commita (a nie do mutowalnego tagu)
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Kontrola skladni i testy
        run: |
          npm run check
          npm test

      # Reguly bazy z repo -> projekt (inaczej plik regul bylby tylko dokumentacja)
      - name: Wdrozenie regul Realtime Database
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAN_E5CE7 != '' }}
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAN_E5CE7 }}
        run: |
          npm install -g firebase-tools
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          firebase deploy --only database --project plan-e5ce7 --non-interactive

      - name: Publikacja hostingu
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAN_E5CE7 }}
          channelId: live
          projectId: plan-e5ce7
          target: plan5a
