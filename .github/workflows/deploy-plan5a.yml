# Deploy wspólnego kodu na hosting klasy 5a (projekt plan-e5ce7 -> plan5a.web.app)
name: Deploy plan5a on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PLAN_E5CE7 }}
          channelId: live
          projectId: plan-e5ce7
